name: Build App Portable

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Installer les dépendances
        run: cd serveur && npm install
        
      - name: Préparer le dossier
        run: |
          mkdir dist
          cp -r serveur dist/
          cp -r client dist/
          cd dist/serveur
          npm install
          
      - name: Créer le lanceur
        run: |
          echo "@echo off" > dist/Demarrer.bat
          echo "cd /d %~dp0" >> dist/Demarrer.bat
          echo "start /B node serveur/index.js" >> dist/Demarrer.bat
          echo "timeout /t 3 >nul" >> dist/Demarrer.bat
          echo "start http://localhost:3000" >> dist/Demarrer.bat
          echo "echo Application lancee ! Ne ferme pas cette fenetre." >> dist/Demarrer.bat
          echo "pause >nul" >> dist/Demarrer.bat
          
      - name: Créer le ZIP
        run: Compress-Archive -Path dist/* -DestinationPath studio-logo-Windows.zip
        
      - name: Sauvegarder le ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Application-Windows
          path: studio-logo-Windows.zip
